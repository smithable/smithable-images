# The Smithable image library. Every entry is either generated from `prompt` (the style below is
# appended per kind) or copied `from` a file. `alt` doubles as the picture's search text; `tags` are
# matched by `new --describe` and the picture picker. Orientation, tone and color are computed into
# index.json. Tags starting with `starter-` mark pictures a starter ships its own copy of.
defaults:
  quality: medium
  models:
    hero: gpt-image-2
    sample: gpt-image-1-mini
    logo: gpt-image-1
  style:
    hero: >-
      Photograph, natural daylight, a Nordic setting, warm and lively colors. A wide composition with
      quiet space in the upper left for a headline. A place in use rather than empty: if people are in it,
      they are busy with what the place is for, natural and unposed, small in the frame or seen from the
      side, and look content. Everything physically plausible and of today. No text, no signs, no logos,
      no brands, no watermark.
    sample: >-
      Photograph, natural daylight, a Nordic setting, lively and natural colors, shallow depth of field.
      Exactly what the description names, as one clear subject that reads well as a small picture, and
      nothing added: an animal, a building, a room or a thing is shown on its own, without people. When
      the description names people, they are busy with what it says, natural and unposed, with warm,
      friendly expressions, their hands on the task or at rest. Each person dressed differently in
      everyday clothes: navy, denim blue, forest green, grey, white, black, beige, now and then a
      bright yellow or red. The background is the place itself. Everything physically plausible and of today. No
      text, no signs, no logos, no brands, no watermark.
    # Products and things for sale (an entry's `style: product`): the item alone, whole and in focus.
    product: >-
      Product photograph, natural daylight, warm and lively colors. The item is the subject: shown whole,
      centered and sharp, in the setting where it belongs (an outdoor thing outdoors, a home thing in a
      Nordic home), on a calm, uncluttered background; a prop or two at most, never taking the focus. No
      people, no hands. Contemporary unless the description says otherwise, and physically plausible. No
      text, no signs, no logos, no brands, no watermark.
    # Second-hand listings (an entry's `style: listing`): the item in full and in focus, life around it allowed.
    listing: >-
      Photograph of a second-hand item for sale, as a person takes it for a listing: natural daylight,
      warm and lively colors, the item the clear subject, shown in full and in focus, in everyday
      surroundings (a home, a garage, a garden, a street). People in the background, a hand or a foot at
      the edge are fine and look natural. Everything physically plausible and of today. No text, no signs,
      no logos, no brands, no watermark.
    # Marks are drawn as is, with no tile behind them, on a white page and in a dark shell alike.
    logo: >-
      A professional brand mark as a design studio would draw it for a real company: geometric
      construction, two tones or one tone and its darker shade, negative space, a little asymmetry or a
      cut, confident clean shapes. Not clip-art, not an emoji, not an icon set, not an illustration.
      Centered, on a transparent background. The colors are of mid lightness and clearly saturated (teal, coral, amber, a clear blue, a fresh
      green, magenta), so the mark reads on white and on a dark navy ground alike; never navy, black,
      dark green, brown, dark grey or pale grey. Not a photograph. No letters, no text.
    # A starter's monogram (an entry's `style: monogram`): its initials as a mark.
    monogram: >-
      A monogram brand mark of only the letters given, drawn as a bold geometric sans-serif letterform
      with sculpted, constructed strokes, two tones or one tone and its darker shade, a cut or negative
      space where the letters meet, like the lettering of a modern tech wordmark. Nothing but these
      letters. Centered, on a transparent background. The colors are of mid lightness and clearly saturated (teal, coral, amber, a clear blue, a fresh
      green, magenta), so the mark reads on white and on a dark navy ground alike; never navy, black,
      dark green, brown, dark grey or pale grey. Not a photograph.
