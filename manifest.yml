# The Smithable image library. Every entry is either generated from `prompt` (the style below is
# appended per kind) or copied `from` a file. `alt` doubles as the picture's search text; `tags` are
# matched by `new --describe` and the picture picker. Orientation, tone and color are computed into
# index.json. Tags starting with `starter-` mark pictures a starter ships its own copy of.
defaults:
  quality: medium
  models:
    hero: gpt-image-2
    sample: gpt-image-1-mini
    logo: gpt-image-1-mini
  style:
    hero: >-
      Photograph, natural light, a Nordic setting, muted colors. A wide, calm composition with quiet space
      in the upper left for a headline. People, if any, small in the frame or seen from behind.
      No text, no signs, no logos, no brands, no watermark.
    sample: >-
      Photograph, natural light, a Nordic setting, muted colors, shallow depth of field. One subject, centered,
      on an uncluttered background so it reads on a small card. People, if any, seen from behind or at a
      distance, unless the subject is a portrait. No text, no signs, no logos, no brands, no watermark.
    logo: >-
      A simple flat abstract mark in one or two solid colors, centered, on a transparent background.
      Not a photograph. No letters, no text.
